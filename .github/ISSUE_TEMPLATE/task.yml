name: ⚙️ Technical Task / Sub-Issue
description: Concrete engineering sub-task attached to a parent User Story
title: "feat/chore: "
labels: ["type: task"]
body:
  - type: input
    id: parent_story
    attributes:
      label: 🔗 Parent Story
      description: Link or reference to the parent Story issue (e.g. #1).
      placeholder: "#1"
    validations:
      required: true
  - type: textarea
    id: technical_description
    attributes:
      label: 📋 Technical Description
      description: Concrete implementation details and reuse strategy.
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: 🛠️ Implementation Checklist
      value: |
        - [ ] Step 1: Implementation
        - [ ] Step 2: Verification (`pnpm typecheck`, `pnpm lint`, unit tests)
        - [ ] Step 3: Post-Implementation Audit
    validations:
      required: true
